
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Умная заявка на импортный товар</title>
  <style>
    :root {
      --bg:#f6f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
      --brand:#1a73e8; --brand2:#1558b0; --danger:#b91c1c;
      --shadow:0 10px 25px rgba(0,0,0,.06); --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:var(--bg);color:var(--text)
    }
    .wrap{max-width:980px;margin:40px auto;padding:0 18px}
    .hero{
      background:linear-gradient(135deg,rgba(26,115,232,.14),rgba(17,185,129,.10));
      border:1px solid rgba(26,115,232,.18);
      border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)
    }
    .hero h1{margin:0 0 6px}
    .hero p{margin:0;color:var(--muted)}
    .card{
      background:var(--card);border:1px solid var(--line);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:16px
    }
    h2{font-size:15px;margin:0 0 10px}
    .field{margin-top:12px}
    label{font-weight:600;font-size:13px;display:block;margin-bottom:6px}
    .req::after{content:" *";color:var(--danger)}
    input,textarea,select{
      width:100%;padding:10px;border:1px solid var(--line);
      border-radius:10px;font-size:14px
    }
    textarea{resize:vertical}
    .row{display:grid;grid-template-columns:1fr;gap:10px}
    @media(min-width:860px){.row{grid-template-columns:1fr 1fr}}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button{
      border:none;border-radius:12px;padding:10px 14px;
      font-weight:600;cursor:pointer
    }
    .primary{background:var(--brand);color:#fff}
    .ghost{background:#fff;border:1px solid var(--line)}
    .item{border:1px dashed var(--line);border-radius:12px;padding:16px;margin-top:14px}
    .item-header{display:flex;justify-content:space-between;align-items:center}
    .remove{background:#fee2e2;color:#991b1b}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Умная заявка на импортный товар</h1>
    <p>Форма поддерживает несколько товарных позиций в одной заявке.</p>
  </div>

  <form id="form">
    <div class="card">
      <h2>Контактная информация</h2>
      <div class="row">
        <div class="field">
          <label class="req">Компания</label>
          <input required>
        </div>
        <div class="field">
          <label class="req">Контактное лицо</label>
          <input required>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Товарные позиции</h2>
      <div id="items"></div>

      <div class="actions">
        <button type="button" class="ghost" onclick="addItem()">+ Добавить товар</button>
      </div>
    </div>

    <div class="card">
      <div class="actions">
        <button class="primary" type="submit">Отправить заявку</button>
      </div>
    </div>
  </form>
</div>

<template id="itemTemplate">
  <div class="item">
    <div class="item-header">
      <strong>Товар</strong>
      <button type="button" class="remove" onclick="this.closest('.item').remove()">Удалить</button>
    </div>

    <div class="row">
      <div class="field">
        <label class="req">Наименование</label>
        <input required>
      </div>
      <div class="field">
        <label class="req">Модель / артикул</label>
        <input required>
      </div>
    </div>

    <div class="field">
      <label class="req">Тип действия</label>
      <select required>
        <option value="">Выберите</option>
        <option>Электрический</option>
        <option>Механический</option>
        <option>Гидравлический</option>
        <option>Пневматический</option>
        <option>Тепловой</option>
        <option>Химический</option>
        <option>Другое</option>
      </select>
    </div>

    <div class="row">
      <div class="field">
        <label class="req">Количество</label>
        <input type="number" required>
      </div>
      <div class="field">
        <label class="req">Ед. измерения</label>
        <select required>
          <option>шт</option>
          <option>кг</option>
          <option>м</option>
          <option>комплект</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Доп. технические параметры</label>
      <textarea></textarea>
    </div>
  </div>
</template>

<script>
function addItem(){
  const tpl = document.getElementById('itemTemplate');
  const clone = tpl.content.cloneNode(true);
  document.getElementById('items').appendChild(clone);
}
addItem();
</script>
</body>
</html>
